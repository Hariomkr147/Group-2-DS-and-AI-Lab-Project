name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Tests start an embedded PostgreSQL (pgserver) and set their own test credentials.
      - run: uv run pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block .env files and common key patterns
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is committed. Remove it and rotate the secrets."; exit 1
          fi
          if git grep -nIE 'postgres(ql)?(\+psycopg)?://[^:@/ ]+:[^@ ]{6,}@[a-z0-9.-]+\.(supabase\.(co|com))|sb_secret_[A-Za-z0-9_-]+|service_role' -- . ':!.github' ':!ai-log' ':!AGENTS.md'; then
            echo "Possible database password or secret key committed. Remove it and rotate it."; exit 1
          fi
