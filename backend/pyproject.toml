[project]
name = "socratic-tutor-backend"
version = "0.1.0"
description = "API for the Socratic AI Tutor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2",
    "pgserver>=0.1.4",  # embedded PostgreSQL so tests need no Docker
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
